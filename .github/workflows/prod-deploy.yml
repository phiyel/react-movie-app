name: Build and Deploy React Movie to cPanel

on:
  push:
    branches:
      - main

  # Allows you to run the deployment manually from GitHub.
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://rbonney.me/movie-app/

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Run tests
        env:
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run test --if-present -- --ci --watchAll=false
        continue-on-error: false

      - name: Build application
        env:
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Normalize FTP host
        id: ftp_host
        env:
          RAW_FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail

          if [ -z "${RAW_FTP_SERVER}" ]; then
            echo "::error::FTP_SERVER secret is missing or empty."
            exit 1
          fi

          HOST="${RAW_FTP_SERVER#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST#sftp://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          HOST="$(echo "${HOST}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "${HOST}" ]; then
            echo "::error::FTP_SERVER must be a hostname like ftp.example.com (no protocol/path)."
            exit 1
          fi

          echo "host=${HOST}" >> "$GITHUB_OUTPUT"

      - name: FTP preflight check (DNS and port)
        env:
          FTP_HOST: ${{ steps.ftp_host.outputs.host }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: |
          set -euo pipefail

          echo "Resolving ${FTP_HOST}..."
          if ! getent hosts "${FTP_HOST}" >/dev/null; then
            echo "::error::Could not resolve FTP host '${FTP_HOST}'. Check FTP_SERVER secret value."
            echo "::error::Use only a hostname (e.g. ftp.example.com), not ftp://, ftps://, sftp://, or a full URL."
            exit 1
          fi

          echo "Checking TCP connectivity to ${FTP_HOST}:${FTP_PORT}..."
          if ! nc -z -w 10 "${FTP_HOST}" "${FTP_PORT}"; then
            echo "::error::Could not connect to ${FTP_HOST}:${FTP_PORT} from GitHub runner."
            echo "::error::Verify FTP protocol/port, firewall, and any IP allowlist at your hosting provider."
            exit 1
          fi

      - name: Deploy build to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # This action supports ftp and ftps only (not sftp).
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./build/
          # Default to current FTP root so deploys do not create movie-app/movie-app.
          server-dir: ${{ vars.PROD_FTP_SERVER_DIR || './' }}
          # Remove old files first so stale hashed assets do not remain after deploy.
          dangerous-clean-slate: true
